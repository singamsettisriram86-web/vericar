  </style>
  <!-- Background contour for dark/light contrast -->
  <path d="M 4 20 C 8 19.5, 14 19, 17 13 C 19 9, 29 9, 32 12.5 C 34 15, 35 17, 36 18" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
